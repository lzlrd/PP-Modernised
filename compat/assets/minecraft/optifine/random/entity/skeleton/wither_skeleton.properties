# Wither skeleton variants for PP Modernised running alongside Sparkles (Incendium).
# Rules 1 and 2 are Sparkles' named Incendium mobs, copied from Sparkles 1.1.12 (c) 2024 Stardust Labs, BSD 3-Clause.
# They use Sparkles' own skins 2-8 and 10. Rules 3-6 are PPL's biome variants, moved to skins 11-18 so the two sets
# no longer overwrite each other. Named mobs come first, so a Headless Warrior keeps its look in any biome.

# Headless Warrior
skins.1=2-8
teams.1=in.noname
name.1=regex:(Headless Warrior|Kopfloser Krieger|Guerrero Decapitado|Guerrier sans tête|Fejetlen Harcos|Guerriero senza testa|首なし騎士|목 없는 기사|Guerreiro sem Cabeça|Безглавый воин|Kafasız Şövalye|Безголовий Воїн|Chiến binh không đầu)

# Withered Scientist
skins.2=10
teams.2=in.noname
name.2=regex:(Withered Scientist|Verdorrter Wissenschaftler|Científico en Decadencia|Scientifique flétri|Sorvasztott Tudós|Scienziato appassito|ウィザーサイエンティスト|위더 스켈레톤 과학자|Cientista Decomposto|Иссушеный учёный|Kurumuş Bilim Adamı|Висушений Вчений|Nhà khoa học khô héo)

# PPL: soul sand valley
skins.3=12 13
weights.3=3 1
biomes.3=soul_sand_valley

# PPL: warped forest
skins.4=14 15
weights.4=3 1
biomes.4=warped_forest

# PPL: basalt deltas
skins.5=16 17
weights.5=3 1
biomes.5=basalt_deltas

# PPL: everywhere else
skins.6=11 18
weights.6=1 3
